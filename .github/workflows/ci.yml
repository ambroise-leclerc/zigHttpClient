name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} with Zig ${{ matrix.zig-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Zig 0.13 cannot link its build runner against the macOS 15 SDK used by
        # macos-latest. Keep the supported three-platform matrix on macOS 14.
        os: [ubuntu-latest, windows-latest, macos-14]
        zig-version: [0.13.0]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Zig version
        run: zig version

      - name: Build
        run: zig build

      - name: Run tests
        run: zig build test | tee test-results.txt
